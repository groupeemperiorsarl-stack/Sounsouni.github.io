<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
#gl{position:absolute;inset:0;width:390px;height:844px}
.word{top:560px;perspective:600px}
.word span{color:#fff;text-shadow:0 0 18px rgba(200,240,122,.55),0 3px 0 #2e6b1f;transform-style:preserve-3d}
.word span.i{color:#c8f07a}
.tag{top:632px;color:#e9f7c8}
.bar{top:760px}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><div id="stage"><canvas id="gl"></canvas>
<div class="word" id="word"></div><div class="tag" id="tag">Le marché digital du Mali</div><div class="bar" id="bar"><i id="bari"></i></div></div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
window.READY=false;
document.getElementById("word").innerHTML=[..."Sounsouni"].map((c,i)=>`<span class="${i==7?'i':''}">${c}</span>`).join("");
const W=390,H=844,CY=110;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById("gl"),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(2);renderer.setSize(W,H,false);renderer.setClearColor(0x03140a,1);
const scene=new THREE.Scene();const cam=new THREE.PerspectiveCamera(40,W/H,1,5000);const D=(H/2)/Math.tan(THREE.MathUtils.degToRad(20));cam.position.set(0,0,D);cam.lookAt(0,0,0);
const bgMat=new THREE.ShaderMaterial({depthWrite:false,uniforms:{uT:{value:0}},vertexShader:`varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.999,1.);}`,
 fragmentShader:`varying vec2 v;uniform float uT;void main(){vec2 p=v-vec2(.5,.56);p.x*=.46;float d=length(p);vec3 c=mix(vec3(.07,.2,.08),vec3(.005,.03,.012),smoothstep(0.,.6,d));c+=vec3(.25,.3,.08)*smoothstep(.4,0.,d)*smoothstep(3.6,4.6,uT)*.35;gl_FragColor=vec4(c,1.);}`});
const bg=new THREE.Mesh(new THREE.PlaneGeometry(2,2),bgMat);bg.frustumCulled=false;scene.add(bg);
const img=new Image();img.src="fruit.png";await img.decode();
const ac=document.createElement("canvas");ac.width=616;ac.height=641;const ax=ac.getContext("2d");ax.drawImage(img,0,0);const apx=ax.getImageData(0,0,616,641).data;
const tex=new THREE.Texture(img);tex.needsUpdate=true;tex.colorSpace=THREE.SRGBColorSpace;
// grande image : largeur 400, centrée
const FB=400,FBH=FB*641/616,FBY=40;
function R(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const r=17,centers=[];
for(let cx=-13;cx<=13;cx++)for(let cy=-20;cy<=20;cy++){const x=cx*1.5*r,y=cy*Math.sqrt(3)*r+(cx&1?Math.sqrt(3)/2*r:0);if(Math.abs(x)>W/2+r*2||Math.abs(y)>H/2+r*2)continue;centers.push([x,y]);}
const N=centers.length;
const geo=new THREE.CircleGeometry(r*.97,6);
const aC=new Float32Array(N*2),aR=new Float32Array(N*2);
centers.forEach(([x,y],i)=>{aC[i*2]=x;aC[i*2+1]=y;const u=(x-(-FB/2))/FB,v=1-(y-(FBY-FBH/2))/FBH;let inside=0;
 if(u>0&&u<1&&v>0&&v<1){const px=Math.floor(u*615),py=Math.floor(v*640);inside=apx[(py*616+px)*4+3]>60?1:0;}
 aR[i*2]=R(i);aR[i*2+1]=inside;});
geo.setAttribute("aC",new THREE.InstancedBufferAttribute(aC,2));geo.setAttribute("aR",new THREE.InstancedBufferAttribute(aR,2));
const mat=new THREE.ShaderMaterial({side:THREE.DoubleSide,transparent:true,uniforms:{uT:{value:0},uTex:{value:tex},uL:{value:new THREE.Vector3(.4,.5,1)},uGS:{value:1},uGY:{value:0},uGap:{value:.97},uFade:{value:1}},
vertexShader:`attribute vec2 aC;attribute vec2 aR;uniform float uT;uniform float uGS;uniform float uGY;uniform float uGap;varying vec2 vL;varying vec2 vC;varying float vIn;varying float vOut;
float eio(float x){return x<.5?4.*x*x*x:1.-pow(-2.*x+2.,3.)/2.;}
float eo(float x){return 1.-pow(1.-x,3.);}
mat3 rotY(float a){float c=cos(a),s=sin(a);return mat3(c,0.,-s,0.,1.,0.,s,0.,c);}
mat3 rotX(float a){float c=cos(a),s=sin(a);return mat3(1.,0.,0.,0.,c,s,0.,-s,c);}
void main(){
 float d=length(aC*vec2(1.,.62))/300.;
 float ap=eo(clamp((uT-d*.55)/.45,0.,1.));
 float fk=eio(clamp((uT-.95-d*1.05-aR.x*.12)/.6,0.,1.));
 vec3 p=position*(uGap/.97)*ap;
 p=rotY(3.14159*fk)*p;
 vec3 c=vec3(aC,0.);c.z+= -220.*(1.-ap)+sin(3.14159*fk)*55.;
 // envol des écailles hors du fruit
 float ok=eo(clamp((uT-2.55-aR.x*.5)/.9,0.,1.))*(1.-aR.y);
 p=rotX(ok*(3.+aR.x*6.))*p;
 c+=vec3(c.xy*ok*1.4,ok*(700.+aR.x*500.));
 vec3 w=c+p;w.xy=w.xy*uGS+vec2(0.,uGY);
 vL=position.xy;vC=aC;vIn=aR.y;vOut=ok;
 gl_Position=projectionMatrix*modelViewMatrix*vec4(w,1.);}`,
fragmentShader:`uniform sampler2D uTex;uniform vec3 uL;uniform float uFade;varying vec2 vL;varying vec2 vC;varying float vIn;varying float vOut;
void main(){
 float rr=length(vL)/${(r*.97).toFixed(2)};
 vec3 n=normalize(vec3(vL/${(r).toFixed(1)}*1.15,1.));
 vec3 L=normalize(uL);float df=max(dot(n,L),0.);float sp=pow(max(dot(reflect(-L,n),vec3(0,0,1)),0.),24.);
 vec3 col;float a=1.;
 if(gl_FrontFacing){
  vec3 base=mix(vec3(.28,.45,.13),vec3(.56,.72,.27),fract(sin(dot(vC,vec2(12.9,78.2)))*437.5));
  col=base*(.22+.95*df)+vec3(1.,1.,.85)*sp*.45;col*=1.-smoothstep(.72,1.,rr)*.6;
 } else {
  vec2 wp=vC+vec2(-vL.x,vL.y);
  vec2 uv=vec2((wp.x+${(FB/2).toFixed(1)})/${FB.toFixed(1)},(wp.y-(${(FBY-FBH/2).toFixed(2)}))/${FBH.toFixed(2)});
  vec4 t=texture2D(uTex,uv);if(uv.x<0.||uv.x>1.||uv.y<0.||uv.y>1.)t=vec4(0.);
  vec3 bgc=vec3(.03,.11,.05)*(.6+.6*df);
  col=mix(bgc,t.rgb,t.a)*(.8+.35*df)+vec3(1.)*sp*.25*t.a;col*=1.-smoothstep(.85,1.,rr)*.3;
 }
 a=uFade*(1.-vOut);
 gl_FragColor=vec4(col,a);
 #include <colorspace_fragment>
}`});
const tiles=new THREE.InstancedMesh(geo,mat,N);const m4=new THREE.Matrix4();for(let i=0;i<N;i++)tiles.setMatrixAt(i,m4);tiles.frustumCulled=false;scene.add(tiles);
// fruit net final
const FW=260,FH=FW*641/616;
const fMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uTex:{value:tex},uA:{value:0},uT:{value:0}},vertexShader:`varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`uniform sampler2D uTex;uniform float uA;uniform float uT;varying vec2 v;void main(){vec4 t=texture2D(uTex,v);float s=smoothstep(.06,0.,abs(v.x+v.y*.5-mod(uT*.7,2.2)+.35));gl_FragColor=vec4(t.rgb+vec3(1.,1.,.8)*s*.22*t.a,t.a*uA);
 #include <colorspace_fragment>
 }`});
const fruit=new THREE.Mesh(new THREE.PlaneGeometry(FW,FH),fMat);fruit.position.set(0,CY,5);scene.add(fruit);
const comp=new EffectComposer(renderer);comp.setPixelRatio(2);comp.setSize(W,H);comp.addPass(new RenderPass(scene,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(W*2,H*2),.35,.4,.7);comp.addPass(bloom);comp.addPass(new OutputPass());
const tl=gsap.timeline({paused:true});
tl.set(".word span",{opacity:0,rotationY:-90,z:-80}).set("#tag",{opacity:0,y:12}).set("#bar",{opacity:0})
 .to(".word span",{opacity:1,rotationY:0,z:0,duration:.7,stagger:.07,ease:"back.out(1.8)"},4.0)
 .to("#tag",{opacity:1,y:0,duration:.8,ease:"power2.out"},4.7)
 .to("#bar",{opacity:1,duration:.4},4.9).fromTo("#bari",{width:"0%"},{width:"100%",duration:2,ease:"power1.inOut"},4.9);
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
window.frame=function(t){
 tl.seek(t,false);mat.uniforms.uT.value=t;bgMat.uniforms.uT.value=t;fMat.uniforms.uT.value=t;
 const la=-1.2+t*1.1;mat.uniforms.uL.value.set(Math.cos(la)*.7,Math.sin(la)*.7+.3,1);
 const k=sm(3.0,3.9,t);mat.uniforms.uGS.value=1-k*(1-FW/FB);mat.uniforms.uGY.value=k*(CY-FBY*FW/FB);
 mat.uniforms.uGap.value=.97+.07*sm(3.6,3.95,t);
 const f=sm(3.85,4.25,t);fMat.uniforms.uA.value=f;mat.uniforms.uFade.value=1-f;
 fruit.scale.setScalar(1+.012*Math.sin(t*2.4)*f);
 cam.position.set(Math.sin(t*.35)*30*(1-k),-20*(1-k),D);cam.lookAt(0,0,0);
 bloom.strength=.35+.4*Math.max(0,1-Math.abs(t-4.05)/.3);
 comp.render();
};
window.DUR=7;frame(0);window.READY=true;
</script></body></html>
