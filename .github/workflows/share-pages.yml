name: Pages de partage des articles
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/make-share-pages.mjs", ".github/workflows/share-pages.yml"]
permissions:
  contents: write
concurrency:
  group: share-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/make-share-pages.mjs
      - name: Enregistrer les pages si elles ont changé
        run: |
          git config user.name "sounsouni-bot"
          git config user.email "bot@sounsouni.pro"
          git add -A p
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Pages de partage des articles (mise à jour automatique)"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
