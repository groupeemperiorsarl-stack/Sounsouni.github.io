<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Sounsouni — Document</title>
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6f1;color:#1a1a2e}
  .box{max-width:420px;margin:0 auto;padding:40px 18px;text-align:center}
  .box b.ic{font-size:46px;display:block;margin-bottom:6px}
  .box p{font-size:16px;line-height:1.5}
  .btn{display:block;width:100%;box-sizing:border-box;margin:12px 0;padding:15px;border:0;border-radius:14px;background:#2e7d32;color:#fff;font-size:17px;font-weight:700}
  .btn.alt{background:#fff;color:#2e7d32;border:2px solid #2e7d32}
  #sns-bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px;background:rgba(255,255,255,.96);box-shadow:0 -2px 10px rgba(0,0,0,.12);z-index:99999}
  #sns-bar button{flex:1;padding:14px;border:0;border-radius:12px;background:#2e7d32;color:#fff;font-size:16px;font-weight:700;font-family:Arial,sans-serif}
  @media print{#sns-bar{display:none!important}}
</style>
</head>
<body>
<div class="box" id="box"><b class="ic">⏳</b><p>Préparation du document…</p></div>
<script>
(function () {
  var URL_FN = "https://oyavnyflqnvqiysgvefl.supabase.co/functions/v1/gestion-sync", KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95YXZueWZscW52cWl5c2d2ZWZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NzUzOTQsImV4cCI6MjEwMTI1MTM5NH0.s_BF9CtSoVtdq9JYp4ToYUvM_Q7H-LDGsNKOyNAQRC8";
  var box = document.getElementById("box");
  var id = (location.hash || "").replace("#", "");
  function msg(ic, t) { box.innerHTML = '<b class="ic">' + ic + '</b><p>' + t + '</p>'; }
  if (!/^[a-f0-9]{32}$/.test(id)) { msg("❌", "Lien invalide. Retournez dans Sounsouni et réessayez."); return; }
  fetch(URL_FN, { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + KEY }, body: JSON.stringify({ operation: "doc_get", id: id }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.success) { msg("⌛", "Ce document n'est plus disponible (plus de 2 heures). Retournez dans Sounsouni et recommencez."); return; }
      if (d.kind === "print") return showPrint(d);
      showFile(d);
    })
    .catch(function () { msg("📶", "Pas de connexion. Vérifiez internet puis rechargez cette page."); });

  function showPrint(d) {
    var html = decodeURIComponent(escape(atob(d.data)));
    document.open(); document.write(html); document.close();
    var add = function () {
      var bar = document.createElement("div"); bar.id = "sns-bar";
      bar.innerHTML = '<style>#sns-bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px;background:rgba(255,255,255,.96);box-shadow:0 -2px 10px rgba(0,0,0,.12);z-index:99999}#sns-bar button{flex:1;padding:14px;border:0;border-radius:12px;background:#2e7d32;color:#fff;font-size:16px;font-weight:700;font-family:Arial,sans-serif}@media print{#sns-bar{display:none!important}}body{padding-bottom:80px}</style><button id="sns-print">🖨️ Imprimer / PDF</button>';
      document.body.appendChild(bar);
      document.getElementById("sns-print").onclick = function () { window.print(); };
      setTimeout(function () { try { window.print(); } catch (e) {} }, 700);
    };
    if (document.readyState === "complete") add(); else window.addEventListener("load", add);
  }

  function showFile(d) {
    var bin = atob(d.data), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    var blob = new Blob([u], { type: d.mime }), href = URL.createObjectURL(blob);
    var file = null; try { file = new File([blob], d.name, { type: d.mime }); } catch (e) {}
    var canShare = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));
    var h = '<b class="ic">📄</b><p><b>' + d.name.replace(/[<>&]/g, "") + '</b></p>';
    if (d.mime === "image/png") h += '<img src="' + href + '" alt="" style="max-width:100%;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.1)">';
    h += '<a class="btn" id="dl" href="' + href + '" download="' + d.name + '">⬇️ Télécharger</a>';
    if (canShare) h += '<button class="btn alt" id="sh">📤 Partager (WhatsApp, e-mail…)</button>';
    h += '<p style="font-size:13px;opacity:.7">Le fichier se trouve ensuite dans « Téléchargements » de votre téléphone.</p>';
    box.innerHTML = h;
    if (canShare) document.getElementById("sh").onclick = function () { navigator.share({ files: [file], title: d.name }).catch(function () {}); };
    setTimeout(function () { try { document.getElementById("dl").click(); } catch (e) {} }, 400);
  }
})();
</script>
</body>
</html>
