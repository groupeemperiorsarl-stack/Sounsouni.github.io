  el.innerHTML = "";
  items.forEach(function(item) {
    var li = document.createElement("li");
    li.textContent = item;
    el.appendChild(li);
  });
}

function applyLang(lang) {
  var dict = TRANSLATIONS[lang] || TRANSLATIONS.fr;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(function(el) {
    var key = el.getAttribute("data-i18n");
    if (dict[key] !== undefined) el.textContent = dict[key];
  });
  renderList("s1-list", dict.s1_list);
  renderList("s2-list", dict.s2_list);
  renderList("s3-list", dict.s3_list);
  renderList("s5-list", dict.s5_list);
  document.querySelectorAll("[data-lang-btn]").forEach(function(btn) {
    btn.classList.toggle("active", btn.getAttribute("data-lang-btn") === lang);
  });
}

function setLang(lang) {
  applyLang(lang);
  try { localStorage.setItem("sounsouni_privacy_lang", lang); } catch (e) {}
  var url = new URL(window.location.href);
  url.searchParams.set("lang", lang);
  window.history.replaceState({}, "", url);
}

(function init() {
  var params = new URLSearchParams(window.location.search);
  var lang = params.get("lang");
  if (!lang) {
    try { lang = localStorage.getItem("sounsouni_privacy_lang"); } catch (e) {}
  }
  if (!lang || !TRANSLATIONS[lang]) lang = "fr";
  applyLang(lang);
})();
</script>

</body>
</html>
