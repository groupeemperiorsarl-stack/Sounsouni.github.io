    <script>
    // ---------- Surveillance indépendante du démarrage ----------
    // Petit programme séparé, chargé en tout premier : il fonctionne même si
    // le programme principal s'arrête net. Il note toutes les erreurs, et si
    // l'écran de chargement est encore affiché au bout de 20 s, il le
    // remplace par un rapport (version chargée + erreurs) à copier.
    window.SOUNSOUNI_VERSION = "2026-11-01-n";
    // "Petits cailloux" : chaque étape du démarrage est notée tout de suite
    // dans le stockage du navigateur (écriture immédiate, qui survit même si
    // la page se fige ensuite). Si le démarrage précédent n'est jamais allé
    // au bout, un rapport s'affiche au chargement suivant.
    (function () {
      var KEY = "sns_boot_trace";
      var prev = null;
      try { prev = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
      var trace = { version: window.SOUNSOUNI_VERSION, start: Date.now(), done: false, steps: [] };
      window.__bootMark = function (label) {
        try {
          if (trace.done && trace.steps.length > 60) return;
          trace.steps.push(Math.round((Date.now() - trace.start) / 100) / 10 + "s " + label);
          if (trace.steps.length > 80) trace.steps.splice(1, trace.steps.length - 80);
          localStorage.setItem(KEY, JSON.stringify(trace));
        } catch (e) {}
      };
      window.__bootDone = function () { trace.done = true; window.__bootMark("✅ affichage réussi"); };
      window.__bootMark("page ouverte");
      var diagOn = false;
      try { diagOn = localStorage.getItem("sns_diag_enabled") === "1"; } catch (e) {}
      if (diagOn && prev && !prev.done && prev.steps && prev.steps.length) {
        document.addEventListener("DOMContentLoaded", function () {
          var txt = "Le démarrage précédent ne s'est pas terminé.\nVersion : " + prev.version + "\nDernières étapes :\n" + prev.steps.slice(-25).join("\n");
          var bar = document.createElement("div");
          bar.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:2147483647;background:#fff;padding:14px;font-family:sans-serif;color:#1a1a2e;box-shadow:0 4px 16px rgba(0,0,0,.2);max-height:70vh;overflow:auto;";
          bar.innerHTML = '<div style="font-weight:800;margin-bottom:6px;">⚠️ Rapport de démarrage</div><pre id="boot-trace" style="white-space:pre-wrap;font-size:10.5px;background:#f4f4f4;border-radius:8px;padding:8px;"></pre>' +
            '<button id="boot-trace-copy" style="background:#1a1a2e;color:#fff;border:none;padding:9px 14px;border-radius:10px;font-weight:700;margin:4px 4px 0 0;">Copier</button>' +
            '<button id="boot-trace-close" style="background:#fff;color:#1a1a2e;border:1.5px solid #1a1a2e;padding:9px 14px;border-radius:10px;font-weight:700;margin-top:4px;">Fermer</button>';
          document.body.appendChild(bar);
          document.getElementById("boot-trace").textContent = txt;
          document.getElementById("boot-trace-copy").onclick = function () { var b = this; if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { b.textContent = "✅ Copié"; }, function () { b.textContent = "Copie impossible"; }); };
          document.getElementById("boot-trace-close").onclick = function () { bar.remove(); };
        });
      }
    })();
    window.__earlyErrors = [];
    window.addEventListener("error", function (e) {
      var where = (e.filename || "").split("/").pop() + ":" + (e.lineno || "?") + ":" + (e.colno || "?");
      window.__earlyErrors.push("Erreur : " + e.message + " @ " + where + (e.error && e.error.stack ? "\n  " + String(e.error.stack).split("\n").slice(1, 4).join("\n  ") : ""));
    });
    window.addEventListener("unhandledrejection", function (e) {
      var r = e.reason;
      window.__earlyErrors.push("Promesse rejetée : " + (r && r.message ? r.message : String(r)) + (r && r.stack ? "\n  " + String(r.stack).split("\n").slice(1, 3).join("\n  ") : ""));
    });
    setTimeout(function () {
      // Bloqué si l'écran de chargement est encore là, OU si rien n'a jamais
      // été affiché (programme principal refusé par un navigateur trop
      // ancien : sans ce cas, l'écran restait tout noir, sans message).
      var rootEl = document.getElementById("root");
      if (!document.querySelector(".splash-screen") && rootEl && rootEl.children.length && !document.getElementById("seo-static")) return;
      var tooOld = (window.__earlyErrors || []).some(function (m) { return /SyntaxError|Invalid regular expression|Unexpected token|Unexpected identifier/i.test(m); });
      var diagOn2 = false;
      try { diagOn2 = localStorage.getItem("sns_diag_enabled") === "1"; } catch (e) {}
      if (!diagOn2) {
        // Utilisateur ordinaire : message simple, sans détails techniques.
        var simple = document.createElement("div");
        simple.style.cssText = "position:fixed;inset:0;z-index:2147483647;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:sans-serif;color:#1a1a2e;text-align:center;";
        simple.innerHTML = tooOld
          ? '<div style="font-size:34px;margin-bottom:10px;">📱</div><div style="font-weight:800;font-size:16px;margin-bottom:6px;">Votre téléphone doit être mis à jour</div><div style="font-size:13px;color:#666;margin-bottom:18px;">Votre navigateur est trop ancien pour afficher Sounsouni. Sur iPhone : Réglages › Général › Mise à jour logicielle. Sur Android : mettez à jour Chrome dans le Play Store.</div>'
          : '<div style="font-size:34px;margin-bottom:10px;">⏳</div><div style="font-weight:800;font-size:16px;margin-bottom:6px;">Le chargement prend plus de temps que prévu</div><div style="font-size:13px;color:#666;margin-bottom:18px;">Vérifiez votre connexion internet, puis réessayez.</div><button id="simple-reload" style="background:#7bcb3a;color:#fff;border:none;padding:12px 24px;border-radius:12px;font-weight:700;font-size:14px;">Recharger</button>';
        document.body.appendChild(simple);
        var sr = document.getElementById("simple-reload"); if (sr) sr.onclick = function () { location.reload(); };
        return;
      }
      var report = "Version chargée : " + window.SOUNSOUNI_VERSION + "\nAdresse : " + location.href + "\nNavigateur : " + navigator.userAgent + "\nErreurs (" + window.__earlyErrors.length + ") :\n" + (window.__earlyErrors.length ? window.__earlyErrors.slice(0, 8).join("\n") : "aucune");
      var box = document.createElement("div");
      box.style.cssText = "position:fixed;inset:0;z-index:2147483647;background:#fff;padding:24px 18px;overflow:auto;font-family:sans-serif;color:#1a1a2e;";
      box.innerHTML = '<div style="font-size:30px;text-align:center;">⚠️</div><div style="font-weight:800;text-align:center;margin:6px 0 12px;">Le démarrage est bloqué</div>' +
        '<pre id="early-report" style="white-space:pre-wrap;word-break:break-word;background:#f4f4f4;border-radius:8px;padding:10px;font-size:11px;"></pre>' +
        '<div style="text-align:center;margin-top:12px;"><button id="early-copy" style="background:#1a1a2e;color:#fff;border:none;padding:10px 18px;border-radius:12px;font-weight:700;margin:4px;">Copier le rapport</button>' +
        '<button id="early-reload" style="background:#fff;color:#1a1a2e;border:1.5px solid #1a1a2e;padding:10px 18px;border-radius:12px;font-weight:700;margin:4px;">Recharger</button></div>';
      document.body.appendChild(box);
      document.getElementById("early-report").textContent = report;
      document.getElementById("early-copy").onclick = function () {
        var btn = this;
        var done = function (ok) { btn.textContent = ok ? "✅ Copié" : "Sélectionnez le texte à la main"; };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(report).then(function () { done(true); }, function () { done(false); });
        else done(false);
      };
      document.getElementById("early-reload").onclick = function () { location.hash = ""; location.reload(); };
    }, 20000);
    </script>
